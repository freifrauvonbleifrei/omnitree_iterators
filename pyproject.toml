[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitree-iterators"
version = "0.1.0"
description = "Exact geometric neighborhood iterators for normalized DyAda omnitrees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["dyada[drawing,matplotlib]>=0.0.12"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["omnitree_iterators"]

[tool.coverage.report]
show_missing = true
